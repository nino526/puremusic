name: PURE Music Android Emulator Smoke QA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and smoke-test screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            mkdir -p qa-screenshots
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.puremusic.app android.permission.READ_MEDIA_AUDIO
            adb shell pm grant com.puremusic.app android.permission.RECORD_AUDIO
            adb logcat -c
            for screen in songs playlists settings identify downloads visualizer player; do
              echo "SMOKE: starting $screen"
              adb shell am force-stop com.puremusic.app
              adb shell am start -W -n com.puremusic.app/.MainActivity --es screen "$screen"
              sleep 3
              adb shell pidof com.puremusic.app >/dev/null
              adb shell screencap -p "/sdcard/pure_$screen.png"
              adb pull "/sdcard/pure_$screen.png" "qa-screenshots/$screen.png"
            done
            adb logcat -d -v time > qa-screenshots/logcat.txt
            echo "SMOKE QA passed: 7 screens launched without process exit"
      - name: Upload smoke screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PUREMusic-Android-Emulator-QA
          path: qa-screenshots/
          if-no-files-found: ignore
